name: Source validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.33.0 --ignore-scripts --no-audit --no-fund
      - run: pnpm --config.manage-package-manager-versions=false install --ignore-workspace --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - run: |
          pnpm --config.manage-package-manager-versions=false check
          pnpm --config.manage-package-manager-versions=false build
        env:
          COCODING_TEMPLATE_BASE: /previews/source-validation
